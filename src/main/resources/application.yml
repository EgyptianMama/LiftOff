# ============================
# LiftOff Platform — Main Config
# ============================

spring:
  application:
    name: liftoff-platform

  # --- Java 21 Virtual Threads ---
  threads:
    virtual:
      enabled: true

  # --- Database ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/liftoff}
    username: ${DB_USERNAME:liftoff}
    password: ${DB_PASSWORD:liftoff}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # --- Flyway Migrations ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# --- Server ---
server:
  port: 8080

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ============================
# Custom LiftOff Properties
# ============================
liftoff:
  jwt:
    secret: ${JWT_SECRET:8a3d9241b72e50523e1f0e8f3b2512a8b9f71c35b8e964b18c50c0efbdc9d74a3f5a2e9b1d9c153b6f2f3d61b6e651e7a5c7f8287413d7119ab3f6a29e2f6c8d}
    access-token-expiry: 15m
    refresh-token-expiry: 7d
  caddy:
    admin-url: http://localhost:2019
  deployments:
    base-dir: ./data/deployments

  build:
    max-concurrent: 2
    timeout-seconds: 300
    builder-image: liftoff-builder:latest
    network: liftoff-build-net
    cpu-limit: 1
    memory-limit: 1g
    pids-limit: 256

  deployment:
    base-path: ${DEPLOYMENT_BASE_PATH:/srv/deployments}
    max-kept: 3
